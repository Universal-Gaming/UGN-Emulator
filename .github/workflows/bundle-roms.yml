name: Bundle licensed console ROMs
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bundle-roms.yml"
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download properly licensed homebrew ROMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p roms/nes roms/gb roms/gbc roms/gba roms/genesis
          grab() {
            echo "Fetching $2"
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$1" --output "$2"
            test -s "$2"
          }
          # Source: mxmgorin/oxgbc. Each title retains its own licence (CREDITS.md).
          source='https://raw.githubusercontent.com/mxmgorin/oxgbc/main/crates/web/assets'
          grab "$source/tobudx.gb" "roms/gb/tobudx.gb"
          grab "$source/libbet.gb" "roms/gb/libbet.gb"
          grab "$source/ucity.gbc" "roms/gbc/ucity.gbc"
          grab "$source/geometrix.gbc" "roms/gbc/geometrix.gbc"
          # Source: mmuszkow/2048-nes, Unlicense.
          grab "https://raw.githubusercontent.com/mmuszkow/2048-nes/master/2048.nes" "roms/nes/2048.nes"
          # Source: mike42/8bit-table-tennis, MIT licence.
          grab "https://github.com/mike42/8bit-table-tennis/releases/download/v1.0/table_tennis_v1.0.nes" "roms/nes/table-tennis.nes"
          # Source: benoror/gbadev, MIT; original GBA homebrew builds.
          gba='https://raw.githubusercontent.com/benoror/gbadev/master/ROMS'
          grab "$gba/cebelix.gba" "roms/gba/cebelix.gba"
          grab "$gba/dezgex.gba" "roms/gba/dezgex.gba"
          grab "$gba/mystic_q.gba" "roms/gba/mystic-q.gba"
          grab "$gba/pik_roll.gba" "roms/gba/pik-roll.gba"
          # Source: monteslu/retro-homebrew-games, MIT; built release build-26.
          md='https://github.com/monteslu/retro-homebrew-games/releases/download/build-26'
          grab "$md/tank-battle.bin" "roms/genesis/tank-battle.bin"
          grab "$md/battle-4tris.bin" "roms/genesis/battle-4tris.bin"
          grab "$md/space-shooter.bin" "roms/genesis/space-shooter.bin"
          # Additional authentic console homebrew, from a carefully documented free-game archive.
          # Credits and individual license conditions: CREDITS.md
          free='https://raw.githubusercontent.com/Mylittlestories/recalbox-os-web/main/www/roms'
          mkdir -p roms/snes roms/n64 roms/atari2600 roms/ngp
          grab "$free/nova-the-squirrel.nes" "roms/nes/nova-the-squirrel.nes"
          grab "$free/alter-ego.nes" "roms/nes/alter-ego.nes"
          grab "$free/spacegulls.nes" "roms/nes/spacegulls.nes"
          grab "$free/super-boss-gaiden.sfc" "roms/snes/super-boss-gaiden.sfc"
          grab "$free/n-warp-daisakusen.sfc" "roms/snes/n-warp-daisakusen.sfc"
          grab "$free/kumi-daiko.n64" "roms/n64/kumi-daiko.n64"
          grab "$free/deadeus.gb" "roms/gb/deadeus.gb"
          grab "$free/tobu-tobu-girl.gb" "roms/gb/tobu-tobu-girl.gb"
          grab "$free/celeste-classic.gba" "roms/gba/celeste-classic.gba"
          grab "$free/cave-story.md" "roms/genesis/cave-story.md"
          grab "$free/ultimate-tetris.md" "roms/genesis/ultimate-tetris.md"
          grab "$free/break-an-egg.md" "roms/genesis/break-an-egg.md"
          grab "$free/sheep-it-up.a26" "roms/atari2600/sheep-it-up.a26"
          grab "$free/asteroids-neo.ngp" "roms/ngp/asteroids-neo.ngp"
          # NES Homebrew Hub entries with explicit GPL/zlib/FSFAP redistribution licenses.
          nesdb='https://raw.githubusercontent.com/nesdev-org/homebrew-db/master/entries'
          grab "$nesdb/croom/croom.nes" "roms/nes/concentration-room.nes"
          grab "$nesdb/rhde/rhde.nes" "roms/nes/rhde-furniture-fight.nes"
          grab "$nesdb/thwaite/thwaite128.nes" "roms/nes/thwaite.nes"
          grab "$nesdb/zap-ruder/ruder.nes" "roms/nes/zap-ruder.nes"
          # Additional original ROMs with developer-granted open-source redistribution rights.
          # NES Homebrew Hub, CC BY 4.0, Fizzer & noby.
          grab "$nesdb/cybercoaster/cybercoaster.nes" "roms/nes/cybercoaster.nes"
          # Homebrew Hub Game Boy source database; see title-by-title licenses in CREDITS.md.
          gbdb='https://raw.githubusercontent.com/gbdev/database/master/entries'
          grab "$gbdb/2048gb/2048.gb" "roms/gb/2048gb.gb"
          grab "$gbdb/airplanz/AIRPLANZ.gb" "roms/gb/airplanz.gb"
          grab "$gbdb/lost-in-translation/lost-in-translation.gb" "roms/gb/lost-in-translation.gb"
          grab "$gbdb/adjustris/adjustris.gb" "roms/gb/adjustris.gb"
          grab "$gbdb/dusky-dungeon/DuskyDungeon-0.1.0.gb" "roms/gb/dusky-dungeon.gb"
          grab "$gbdb/a-slime-travel/aslimetravel.gbc" "roms/gbc/a-slime-travel.gbc"
          # Original GPL-3.0 GBA homebrew, author akouzoukos.
          grab "https://raw.githubusercontent.com/gbadev-org/games/master/entries/apotris/Apotris.gba" "roms/gba/apotris.gba"
          # MIT-licensed Nintendo DS homebrew and project: fulldiveVR/FullRoid.Games.
          mkdir -p roms/nds
          grab "https://raw.githubusercontent.com/fulldiveVR/FullRoid.Games/master/repository/nds/lunarrunner.nds" "roms/nds/lunar-runner.nds"
          # Verified game-specific MIT, zlib and GPL grants from gbdev/database metadata.
          # Only original GB/GBC ROMs are installed; games without an explicit license were excluded.
          grab "$gbdb/plantboy/PlantBoy.gb" "roms/gb/plantboy.gb"
          grab "$gbdb/rex-runner-gb/rex-runner.gb" "roms/gb/rex-runner-gb.gb"
          grab "$gbdb/deved_potion-panic/files/potionpanic_jam.gbc" "roms/gbc/potion-panic.gbc"
          grab "$gbdb/squishy-the-turtle/squishy-magfest.gb" "roms/gb/squishy-the-turtle.gb"
          grab "$gbdb/tuff/game.gb" "roms/gb/tuff.gb"
          grab "$gbdb/rebound/Rebound.gbc" "roms/gbc/rebound.gbc"
          grab "$gbdb/flooder/flooder.gb" "roms/gbc/flooder.gbc"
          grab "$gbdb/maxpirate/maxpirate.gb" "roms/gb/maxpirate.gb"
          grab "$gbdb/domination/domination.gb" "roms/gb/domination.gb"
          grab "$gbdb/crossconnect/CrossConnect.gbc" "roms/gbc/crossconnect.gbc"
          grab "$gbdb/grub-glide/GrubGlide.gb" "roms/gb/grub-glide.gb"
          grab "$gbdb/crystal-lake/CrystalLake.gb" "roms/gb/crystal-lake.gb"
          grab "$gbdb/shock-lobster/shocklobster.gb" "roms/gb/shock-lobster.gb"
          grab "$gbdb/carazu/carazu.gb" "roms/gb/carazu.gb"
          grab "$gbdb/big2small/big2small.gb" "roms/gb/big2small.gb"
          grab "$gbdb/gb-wordyl/GBWORDYL_0.85_en.gb" "roms/gb/gb-wordyl.gb"
          grab "$gbdb/el-dueloroso/ElDueloroso.gb" "roms/gb/el-dueloroso.gb"
          grab "$gbdb/rex-run-v1-0/rex-run-v1.0.gb" "roms/gb/rex-run-v1-0.gb"
          grab "$gbdb/escape-obliterizer-dx/ESCAPE_OBLITERIZER_DX.gb" "roms/gbc/escape-obliterizer-dx.gbc"
          grab "$gbdb/bit_bang/bit_bang.gb" "roms/gb/bit_bang.gb"
          grab "$gbdb/sushi-nights/SushiNights.gb" "roms/gb/sushi-nights.gb"
          grab "$gbdb/porklike-gb/porklike.gb" "roms/gb/porklike-gb.gb"
          # Author-licensed releases from the original Homebrew Hub release records.
          # Source links, expected binary sizes, creators, and exact license declarations are in the JSON manifest.
          python3 - <<'PY'
          # This manifest contains only ROMs whose upstream game.json expressly states a redistributable license.
          import json
          import subprocess
          from pathlib import Path
          from urllib.parse import urlsplit
          games=json.loads(Path("catalog/licensed-rom-expansion.json").read_text(encoding="utf-8"))
          assert len(games)==17, "Unexpected licensed-game manifest size"
          for g in games:
              url=g["source"]
              dest=Path(g["path"])
              assert urlsplit(url).hostname=="raw.githubusercontent.com", url
              assert dest.parts[0]=="roms" and ".." not in dest.parts, dest
              dest.parent.mkdir(parents=True,exist_ok=True)
              print("Fetching licensed:",g["title"],"->",dest,flush=True)
              subprocess.run(["curl","--fail","--location","--retry","3","--retry-delay","2","--silent","--show-error",url,"--output",str(dest)],check=True)
              content=dest.read_bytes()
              assert len(content)==g["expected_bytes"], f"Unexpected size for {dest}: {len(content)}"
              assert len(content)>=0x150 and not content[:100].lower().lstrip().startswith(b"<html"), f"Not a ROM: {dest}"
          print("Verified",len(games),"new licensed console ROM downloads")
          PY
          # Validate Nintendo NES header and expected file sizes.
          python3 - <<'PY'
          from pathlib import Path
          import json
          files=list(Path('roms').rglob('*'))
          roms=[p for p in files if p.is_file()]
          expected=62+len(json.loads(Path('catalog/licensed-rom-expansion.json').read_text()))
          assert len(roms)==expected, f'Expected {expected} ROM files, got {len(roms)}'
          for p in roms:
              assert p.stat().st_size >= (4096 if p.suffix=='.a26' else 8000), f'Undersized ROM {p}'
              data=p.read_bytes()
              assert not data.startswith(b'<!DOCTYPE') and not data.startswith(b'<html'),f'HTML error instead of ROM: {p}'
              if p.suffix=='.nes': assert data[:4]==b'NES\x1a',f'Invalid NES ROM: {p}'
              if p.suffix in ('.gb','.gbc'): assert len(data)>=0x150, f'Invalid GB ROM: {p}'
              print(p,p.stat().st_size,'bytes')
          PY

      - name: Commit redistributable ROMs into this repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roms
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Bundle expanded licensed retro console homebrew collection"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "ROM bundle committed and pushed"
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "::error::ROM bundle push failed after retries"
                exit 1
              fi
              sleep 2
            done
          fi
